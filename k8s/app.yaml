apiVersion: apps/v1
kind: Deployment
metadata:
  name: tongla-backend
  namespace: tongla
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tongla-backend
  template:
    metadata:
      labels:
        app: tongla-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/algnot/tongla-account-backend:__IMAGE_TAG__
          volumeMounts:
            - name: tongla-secret-vol
              mountPath: /app/secret
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tongla-config
            - secretRef:
                name: tongla-secret
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tongla-secret-vol
          secret:
            secretName: tongla-account-secret
---
apiVersion: v1
kind: Service
metadata:
  name: tongla-backend
  namespace: tongla
spec:
  type: ClusterIP
  selector:
    app: tongla-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
