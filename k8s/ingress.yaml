apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: account-api-tls
  namespace: tongla
spec:
  secretName: account-api-tls
  dnsNames:
    - account-api.tongla.dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tongla-backend
  namespace: tongla
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Device-ID"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
spec:
  ingressClassName: internal-nginx
  tls:
    - hosts:
        - account-api.tongla.dev
      secretName: account-api-tls
  rules:
    - host: account-api.tongla.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tongla-backend
                port:
                  number: 80
