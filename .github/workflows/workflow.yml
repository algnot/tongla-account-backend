permissions:
  contents: read
  packages: write

name: Deployment Workflow

on: [push]

jobs:

  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./...


  Build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - uses: actions/checkout@v4
      
      - name: Build image
        run: |
          docker build -t ghcr.io/algnot/tongla-account-backend:${{ github.sha }} .

      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          docker push ghcr.io/algnot/tongla-account-backend:${{ github.sha }}

      - name: Tag latest
        run: |
          docker tag ghcr.io/algnot/tongla-account-backend:${{ github.sha }} ghcr.io/algnot/tongla-account-backend:latest
          docker push ghcr.io/algnot/tongla-account-backend:latest
