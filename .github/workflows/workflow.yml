permissions:
  contents: read
  packages: write

name: Deployment Workflow

on: [push]

jobs:

  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./...


  Build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - uses: actions/checkout@v4
      
      - name: Build image
        run: |
          docker build -t ghcr.io/algnot/tongla-account-backend:${{ github.sha }} .

      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          docker push ghcr.io/algnot/tongla-account-backend:${{ github.sha }}

      - name: Tag latest
        run: |
          docker tag ghcr.io/algnot/tongla-account-backend:${{ github.sha }} ghcr.io/algnot/tongla-account-backend:latest
          docker push ghcr.io/algnot/tongla-account-backend:latest


  Deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - uses: actions/checkout@v4

      - name: Render manifests
        run: |
          set -e
          TAG=${{ github.sha }}
          mkdir -p .rendered
          sed "s|__IMAGE_TAG__|${TAG}|g; s|__TAG__|${TAG}|g" k8s/app.yaml > .rendered/app.yaml
          sed "s|__IMAGE_TAG__|${TAG}|g; s|__TAG__|${TAG}|g" k8s/migrate-job.yaml > .rendered/migrate-job.yaml
          sed "s|__IMAGE_TAG__|${TAG}|g; s|__TAG__|${TAG}|g" k8s/ingress.yaml > .rendered/ingress.yaml

      - name: Encode manifests as base64
        run: |
          set -e
          echo "APP_YAML_B64=$(base64 -w0 .rendered/app.yaml)" >> $GITHUB_ENV
          echo "MIGRATE_YAML_B64=$(base64 -w0 .rendered/migrate-job.yaml)" >> $GITHUB_ENV
          echo "INGRESS_YAML_B64=$(base64 -w0 .rendered/ingress.yaml)" >> $GITHUB_ENV

      - name: Apply to microk8s
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          command_timeout: 30m
          envs: APP_YAML_B64,MIGRATE_YAML_B64,INGRESS_YAML_B64
          script: |
            set -e
            TAG=${{ github.sha }}

            echo "$MIGRATE_YAML_B64" | base64 -d > /tmp/migrate-job.yaml
            echo "$APP_YAML_B64" | base64 -d > /tmp/app.yaml
            echo "$INGRESS_YAML_B64" | base64 -d > /tmp/ingress.yaml

            wc -c /tmp/migrate-job.yaml /tmp/app.yaml /tmp/ingress.yaml
            head -n 5 /tmp/migrate-job.yaml
            head -n 5 /tmp/app.yaml
            head -n 5 /tmp/ingress.yaml

            # microk8s kubectl apply -f /tmp/migrate-job.yaml
            # microk8s kubectl -n tongla wait --for=condition=complete job/tongla-migrate-${TAG} --timeout=10m

            microk8s kubectl apply -f /tmp/app.yaml
            microk8s kubectl -n tongla rollout status deployment/tongla-backend --timeout=5m

            microk8s kubectl apply -f /tmp/ingress.yaml
            microk8s kubectl -n tongla describe ingress tongla-backend
