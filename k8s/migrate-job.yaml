# k8s/migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: tongla-migrate-__TAG__
  namespace: tongla
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/algnot/tongla-account-backend:__IMAGE_TAG__
          envFrom:
            - configMapRef:
                name: tongla-config
            - secretRef:
                name: tongla-secret
          env:
            - name: RUN_MIGRATE
              value: "true"
