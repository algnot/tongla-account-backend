apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tongla-backend
  namespace: tongla
spec:
  ingressClassName: nginx
  rules:
    - host: account-api.tongla.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tongla-backend
                port:
                  number: 80
